name: C/C++ CI

on: [push, pull_request]

jobs:
  Linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - api: jack
            APIcmake: JACK
            deps: libjack-dev
          - api: alsa
            APIcmake: ALSA
            deps: libasound-dev
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
    - name: install dependencies
      run:
        sudo apt-get update
        && sudo apt-get install g++ autoconf-archive cmake ${{matrix.deps}}
    - name: automake
      run:
        env NOCONFIGURE=1 ./autogen.sh && mkdir bld-automake && cd bld-automake
        && (../configure --with-${{matrix.api}} || (cat config.log; false))
        && make V=1 && make check
    - name: CMake
      run:
        mkdir bld-cmake && cd bld-cmake
        && cmake .. -DRTMIDI_API_JACK=OFF -DRTMIDI_API_ALSA=OFF -DRTMIDI_API_${{matrix.APIcmake}}=ON
        && make VERBOSE=1

  MacOS:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
    - name: install dependencies
      run: brew install autoconf-archive automake cmake meson libtool
    - name: automake
      run:
        env NOCONFIGURE=1 ./autogen.sh && mkdir bld-automake && cd bld-automake
        && (../configure || (cat config.log; false))
        && make V=1 && make check
    - name: CMake
      run: mkdir bld-cmake && cd bld-cmake && cmake .. && make VERBOSE=1

  MinGW:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - host: i686-w64-mingw32
            api: winmm
          - host: x86_64-w64-mingw32
            api: winmm
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
    - name: install dependencies
      run:
        sudo apt-get update
        && sudo apt-get install g++-mingw-w64 autoconf-archive
    - name: automake
      run:
        env NOCONFIGURE=1 ./autogen.sh
        && mkdir bld-automake && cd bld-automake
        && (../configure --host=${{matrix.host}} --with-${{matrix.api}} CPPFLAGS=${{matrix.cppflags}} || (cat config.log; false))
        && make V=1

  WebMIDI:
    name: WebMIDI backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup Emscripten
      uses: emscripten-core/setup-emsdk@v15
    - name: Configure
      run: >
        emcmake cmake -S . -B bld-webmidi
        -DBUILD_SHARED_LIBS=OFF
        -DRTMIDI_API_JACK=OFF
        -DRTMIDI_API_ALSA=OFF
        -DRTMIDI_API_WEBMIDI=ON
        -DRTMIDI_BUILD_TESTING=ON
    - name: Build Web MIDI smoke test
      run: cmake --build bld-webmidi --target webmidi-smoke --parallel
    - name: Test Web MIDI bridge
      run: ctest --test-dir bld-webmidi -R webmidi-smoke --output-on-failure

  WebMIDIExamples:
    name: WebMIDI example / ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - webmidiprobe
          - webmidiin
          - webmidiout
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup Emscripten
      uses: emscripten-core/setup-emsdk@v15
    - name: Configure Web MIDI build
      run: >
        emcmake cmake -S . -B bld-webmidi
        -DBUILD_SHARED_LIBS=OFF
        -DRTMIDI_API_JACK=OFF
        -DRTMIDI_API_ALSA=OFF
        -DRTMIDI_API_WEBMIDI=ON
        -DRTMIDI_BUILD_TESTING=ON
    - name: Build ${{ matrix.example }}
      run: cmake --build bld-webmidi --target ${{ matrix.example }} --parallel
    - name: Validate ${{ matrix.example }} browser bundle
      shell: bash
      run: |
        set -euo pipefail
        for extension in html js wasm; do
          file="bld-webmidi/tests/${{ matrix.example }}.${extension}"
          test -s "$file"
          echo "validated $file ($(wc -c < "$file") bytes)"
        done
    - name: Upload ${{ matrix.example }} browser bundle
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.example }}-wasm
        if-no-files-found: error
        path: |
          bld-webmidi/tests/${{ matrix.example }}.html
          bld-webmidi/tests/${{ matrix.example }}.js
          bld-webmidi/tests/${{ matrix.example }}.wasm
